<!-- tracking-list.component.html -->
<div class="card p-3" style="min-width: 1000px;">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h5>Driver List</h5>
    <button
      class="btn text-white"
      style="background-color: #124559;"
      data-bs-toggle="modal"
      data-bs-target="#addDriverModal"
    >
      <i class="bi bi-plus-lg"></i> Add New Driver
    </button>
  </div>

  <table class="table table-bordered table-striped">
    <thead>
      <tr>
        <th>Driver Name</th>
        <th>Driver ID</th>
        <th>Contact</th>
        <th>Age</th>
        <th>Email</th>
        <th>License #</th>
        <th>License Expiry</th>
        <th>Aadhaar</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let driver of driverList">
        <td>{{ driver.name }}</td>
        <td>{{ driver.id }}</td>
        <td>{{ driver.mobile }}</td>
        <td>{{ driver.age }}</td>
        <td>{{ driver.email }}</td>
        <td>{{ driver.licenseNumber }}</td>
        <td>{{ driver.licenseExpiry | date: 'dd/MM/yyyy' }}</td>
        <td>{{ driver.aadhaar }}</td>
      </tr>
    </tbody>
  </table>
</div>

<!-- Add Driver Modal -->
<div class="modal fade" id="addDriverModal" tabindex="-1" aria-labelledby="addDriverLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <form (ngSubmit)="addDriver()" #driverForm="ngForm">
        <div class="modal-header">
          <h5 class="modal-title" id="addDriverLabel">Add New Driver</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body row g-3">
          <div class="col-md-6">
            <label class="form-label">Driver Name</label>
            <input type="text" class="form-control" [(ngModel)]="driver.name" name="name" required />
          </div>
          <div class="col-md-6">
            <label class="form-label">Driver ID</label>
            <input type="text" class="form-control" [(ngModel)]="driver.id" name="id" required />
          </div>
          <div class="col-md-6">
            <label class="form-label">Contact</label>
            <input type="text" class="form-control" [(ngModel)]="driver.mobile" name="mobile" required />
          </div>
          <div class="col-md-6">
            <label class="form-label">Age</label>
            <input type="number" class="form-control" [(ngModel)]="driver.age" name="age" required />
          </div>
          <div class="col-md-6">
            <label class="form-label">Email (optional)</label>
            <input type="email" class="form-control" [(ngModel)]="driver.email" name="email" />
          </div>
          <div class="col-md-6">
            <label class="form-label">License Number</label>
            <input type="text" class="form-control" [(ngModel)]="driver.licenseNumber" name="licenseNumber" required />
          </div>
          <div class="col-md-6">
            <label class="form-label">License Expiry Date</label>
            <input type="date" class="form-control" [(ngModel)]="driver.licenseExpiry" name="licenseExpiry" required />
          </div>
          <div class="col-md-6">
            <label class="form-label">Aadhaar Number</label>
            <input type="text" class="form-control" [(ngModel)]="driver.aadhaar" name="aadhaar" required />
          </div>
          <div class="col-md-6">
            <label class="form-label">Emergency Contact Name</label>
            <input type="text" class="form-control" [(ngModel)]="driver.emergencyContactName" name="emergencyContactName" required />
          </div>
          <div class="col-md-6">
            <label class="form-label">Emergency Contact Number</label>
            <input type="text" class="form-control" [(ngModel)]="driver.emergencyContactNumber" name="emergencyContactNumber" required />
          </div>
          <div class="col-md-12">
            <label class="form-label">Driver Photo</label>
            <input type="file" class="form-control" (change)="onFileSelected($event)" />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Add Driver</button>
        </div>
      </form>
    </div>
  </div>
</div>
